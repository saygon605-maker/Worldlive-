name: worldlive
description: WorldLive - تطبيق مراسلة ودردشة وبث مباشر وتفاعل اجتماعي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  timeago: ^3.7.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
